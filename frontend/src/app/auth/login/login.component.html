<div class="auth-container">
  <h2>Accedi a Vault</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email"
             [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
      <div class="error-msg" *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.touched">
        L'email è obbligatoria.
      </div>
      <div class="error-msg" *ngIf="loginForm.get('email')?.errors?.['email'] && loginForm.get('email')?.touched">
        Formato email non valido.
      </div>
      <div class="error-msg" *ngIf="loginForm.get('email')?.errors?.['apiError']">
        {{ loginForm.get('email')?.errors?.['apiError'] }}
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password"
             [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
      <div class="error-msg" *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
        La password è obbligatoria.
      </div>
      <div class="error-msg" *ngIf="loginForm.get('password')?.errors?.['apiError']">
        {{ loginForm.get('password')?.errors?.['apiError'] }}
      </div>
    </div>

    <div class="global-error" *ngIf="globalError">
      {{ globalError }}
    </div>

    <button type="submit" [disabled]="isLoading || loginForm.invalid">
      {{ isLoading ? 'Accesso in corso...' : 'Accedi' }}
    </button>
  </form>

  <p class="switch-auth">Non hai un account? <a routerLink="/register">Registrati</a></p>
</div>
