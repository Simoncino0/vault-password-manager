<div class="form-page">
    <h2>{{ isEdit ? 'Modifica password' : 'Nuova password' }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label>Titolo *</label>
            <input type="text" formControlName="title" placeholder="es. Gmail personale">
            <div class="error-msg" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">Titolo obbligatorio (min 2 caratteri).</div>
        </div>

        <div class="form-group">
            <label>Username / Email *</label>
            <input type="text" formControlName="username">
            <div class="error-msg" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">Username obbligatorio.</div>
        </div>

        <div class="form-group">
            <label>Password *</label>
            <div class="password-input">
                <input type="text" formControlName="password">
                <button type="button" (click)="generatePassword()">🎲 Genera</button>
            </div>
            <app-password-strength [password]="passwordValue"></app-password-strength>
            <div class="error-msg" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Password obbligatoria (min 8 caratteri).</div>
        </div>

        <div class="form-group">
            <label>URL</label>
            <input type="url" formControlName="url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Categoria</label>
            <select formControlName="categoryId">
                <option [ngValue]="null">— Nessuna —</option>
                <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
            </select>
        </div>

        <div class="form-group">
            <label>Note</label>
            <textarea formControlName="notes" rows="3"></textarea>
        </div>

        <div class="actions">
            <button type="submit" [disabled]="form.invalid">💾 Salva</button>
            <a routerLink="/vault">Annulla</a>
        </div>
    </form>
</div>
