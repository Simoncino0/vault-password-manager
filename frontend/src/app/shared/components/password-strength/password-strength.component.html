<div class="strength" *ngIf="password">
  <div class="bars">
    <span [class.filled]="score >= 1" [ngClass]="'c' + score"></span>
    <span [class.filled]="score >= 2" [ngClass]="'c' + score"></span>
    <span [class.filled]="score >= 3" [ngClass]="'c' + score"></span>
    <span [class.filled]="score >= 4" [ngClass]="'c' + score"></span>
  </div>
  <span class="label" [ngClass]="'c' + score">{{ label }} ({{ bits }} bit)</span>
</div>
