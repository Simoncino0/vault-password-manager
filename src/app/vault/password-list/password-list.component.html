<div class="vault-page">
    <div class="header">
        <h2>Il tuo Vault</h2>
        <a routerLink="/vault/new" class="add-btn">+ Aggiungi password</a>
    </div>

    <input class="search" type="text" [(ngModel)]="search" placeholder="🔍 Cerca per titolo, username o URL...">

    <div class="card" *ngFor="let entry of filtered">
        <div class="card-main">
            <div class="title">{{ entry.title }}</div>
            <div class="meta">
                <span>👤 {{ entry.username }}</span>
                <span>🏷️ {{ categoryName(entry.categoryId) }}</span>
                <a *ngIf="entry.url" [href]="entry.url" target="_blank">🔗 {{ entry.url }}</a>
            </div>
            <div class="password-row">
                <code>{{ isVisible(entry.id) ? entry.password : '••••••••••••' }}</code>
                <button (click)="toggleVisible(entry.id)">{{ isVisible(entry.id) ? '🙈 Nascondi' : '👁 Mostra' }}</button>
                <button (click)="copy(entry)">{{ copiedId === entry.id ? '✔ Copiato!' : '📋 Copia' }}</button>
            </div>
            <div class="notes" *ngIf="entry.notes && isVisible(entry.id)">{{ entry.notes }}</div>
        </div>
        <div class="card-actions">
            <a [routerLink]="['/vault/edit', entry.id]">✏️ Modifica</a>
            <ng-container *ngIf="deletePendingId === entry.id; else delBtn">
                <span class="confirm">Confermi?</span>
                <button class="danger" (click)="onDelete(entry.id)">Sì</button>
                <button (click)="cancelDelete()">No</button>
            </ng-container>
            <ng-template #delBtn>
                <button class="danger" (click)="askDelete(entry.id)">🗑 Elimina</button>
            </ng-template>
        </div>
    </div>

    <p class="empty" *ngIf="filtered.length === 0">
        Nessuna password nel Vault. <a routerLink="/vault/new">Aggiungi la prima!</a>
    </p>
</div>
